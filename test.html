<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Polygon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #222;
            color: white;
            /* Додаємо висоту, щоб можна було скролити */
            height: 3000px; 
            padding-top: 100px; /* Місце під шапку */
        }
        
        .header {
            position: fixed;
            /* Використовуємо safe-area-inset щоб Хром не ховав шапку під свою панель */
            top: max(0px, env(safe-area-inset-top));
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(255, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .content {
            text-align: center;
        }
        
        .box {
            width: 80%;
            height: 200px;
            background: #444;
            margin: 20px auto;
            border: 2px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        ФІКСОВАНА ШАПКА (TEST V3)
    </div>

    <div class="content">
        <h1>Тестовий полігон</h1>
        <p>Скрольте вниз, щоб побачити поведінку браузера.</p>
        
        <div class="box">Блок 1</div>
        <div class="box">Блок 2</div>
        <div class="box">Блок 3</div>
        <div class="box">Блок 4</div>
        <div class="box">Блок 5</div>
    </div>

    <!-- IOS CHROME DEBUG LOGGER -->
    <div id="ios-debug-log" style="position:fixed; bottom:0; left:0; width:100%; max-height:25vh; overflow-y:auto; background:rgba(0,0,0,0.95); color:lime; z-index:9999999; font-family:monospace; font-size:12px; padding:10px; border-top: 2px solid lime;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; border-bottom: 1px solid lime; padding-bottom:5px;">
            <strong style="font-size:14px;">LOGS:</strong>
            <button onclick="copyLogs()" style="background:lime; color:black; padding:5px 10px; border:none; font-weight:bold; cursor:pointer;">КОПІЮВАТИ</button>
        </div>
        <div id="log-content" style="white-space: pre-wrap; word-break: break-all;"></div>
    </div>
    <script>
        var logHistory = [];
        var logBox = document.getElementById('log-content');
        
        function printLog(msg) {
            var time = new Date().toISOString().split('T')[1].slice(0, -1);
            var entry = time + ': ' + msg;
            logHistory.push(entry);
            logBox.innerHTML += '<div>' + entry + '</div>';
        }

        function copyLogs() {
            var text = logHistory.join('\n');
            navigator.clipboard.writeText(text).then(function() { alert("Скопійовано!"); }).catch(function() {});
        }
        
        (function() {
            var lastIH = window.innerHeight;
            var lastSY = window.scrollY;
            
            printLog("INIT [TEST] IH:" + lastIH + " SY:" + lastSY);
            
            window.addEventListener('touchstart', function() { printLog("TOUCH START"); }, {passive: true});
            window.addEventListener('touchmove', function() { printLog("TOUCH MOVE"); }, {passive: true});
            window.addEventListener('touchend', function() { printLog("TOUCH END"); }, {passive: true});
            
            window.addEventListener('resize', function() {
                printLog("RESIZE! IH:" + window.innerHeight);
            });
            
            setInterval(function() {
                var currentIH = window.innerHeight;
                if (currentIH !== lastIH) {
                    printLog("HEIGHT CHANGE! IH: " + lastIH + "->" + currentIH);
                    lastIH = currentIH;
                }
                if (Math.abs(window.scrollY - lastSY) > 50) {
                    printLog("SCROLL JUMP! SY: " + lastSY + "->" + window.scrollY);
                    lastSY = window.scrollY;
                }
            }, 500);

            // Відстежуємо коли сторінка повністю завантажилася
            window.addEventListener('load', function() {
                printLog("WINDOW LOAD FIRED");
            });
        })();
    </script>
</body>
</html>
